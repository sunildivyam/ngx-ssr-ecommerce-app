<div class="flex-container">
    <h1 class="col-12 left">Seller Dashboard</h1>
</div>

<div class="flex-container secondary-lighter-bg">
    <div class="left col-12">
        <p>Manage your App</p>
    </div>
</div>
<div class="flex-container">
    <div class="row">
        <!--Profile-->
        <anu-card class="col-sm-12 col-md-6 col-lg-4 shadow spacing" [routerLinkActive]="'active'">
            <anu-card-title>
                <h2>Profile</h2>
            </anu-card-title>
            <anu-card-body> Manage your profile. </anu-card-body>
            <anu-card-footer>
                <div class="row right">
                    <a [routerLink]="['../profile']">Manage profile</a>
                </div>
            </anu-card-footer>
        </anu-card>

        <!--Inventory-->
        <anu-card class="col-sm-12 col-md-6 col-lg-4 shadow spacing" [routerLinkActive]="'active'">
            <anu-card-title>
                <h2>Inventory</h2>
            </anu-card-title>
            <anu-card-body> Manage your inventory. </anu-card-body>
            <anu-card-footer>
                <div class="row right">
                    <a [routerLink]="['../inventory']">Manage inventory</a>
                </div>
            </anu-card-footer>
        </anu-card>


        <!--Orders-->
        <anu-card class="col-sm-12 col-md-6 col-lg-4 shadow spacing" [routerLinkActive]="'active'">
            <anu-card-title>
                <h2>Orders</h2>
            </anu-card-title>
            <anu-card-body> Manage your orders. </anu-card-body>
            <anu-card-footer>
                <div class="row right">
                    <a [routerLink]="['../orders']">Manage orders</a>
                </div>
            </anu-card-footer>
        </anu-card>
    </div>
</div>
